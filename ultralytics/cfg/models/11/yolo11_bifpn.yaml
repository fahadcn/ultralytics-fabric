# FG-YOLO Stage 1: YOLO11n + learnable weighted BiFPN neck (C3k2 capacity kept)
# Baseline for comparison: yolo11.yaml trained from yolo11n.pt (run woven_fabric_defect_v4_new)
# Differences vs stock yolo11.yaml: backbone identical; every neck Concat is replaced by
# channel-matched lateral Conv (1x1) + BiFPNAdd (fast normalized learnable fusion);
# bottom-up nodes add true BiFPN skip edges (P4 backbone skip, P5 backbone skip).

# Parameters
nc: 80 # number of classes (overridden by data.yaml at train time)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11 backbone (UNCHANGED from yolo11.yaml -> all layers transfer from yolo11n.pt)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# FG-YOLO head: weighted bidirectional fusion, C3k2 kept at every node
head:
  # --- laterals (channel matching for weighted add) ---
  - [10, 1, Conv, [512, 1, 1]] # 11: P5 lateral (256->128 @ n)
  - [6, 1, Conv, [512, 1, 1]] # 12: P4 lateral (128->128 @ n)
  - [4, 1, Conv, [256, 1, 1]] # 13: P3 lateral (128->64 @ n)

  # --- top-down ---
  - [11, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[14, 12], 1, BiFPNAdd, []] # 15: fuse up(P5) + P4 lateral
  - [-1, 2, C3k2, [512, False]] # 16: P4_td (128 @ n)

  - [16, 1, Conv, [256, 1, 1]] # 17: 128->64
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[18, 13], 1, BiFPNAdd, []] # 19: fuse up(P4_td) + P3 lateral
  - [-1, 2, C3k2, [256, False]] # 20: P3 out (64 @ n) -> Detect small

  # --- bottom-up ---
  - [20, 1, Conv, [512, 3, 2]] # 21: downsample P3 out (64->128)
  - [[21, 16, 12], 1, BiFPNAdd, []] # 22: P4 out = down(P3) + P4_td + P4 backbone skip
  - [-1, 2, C3k2, [512, False]] # 23: P4 out (128 @ n) -> Detect medium

  - [23, 1, Conv, [1024, 3, 2]] # 24: downsample P4 out (128->256)
  - [[24, 10], 1, BiFPNAdd, []] # 25: P5 out = down(P4) + P5 backbone skip
  - [-1, 2, C3k2, [1024, True]] # 26: P5 out (256 @ n) -> Detect large

  - [[20, 23, 26], 1, Detect, [nc]] # 27: Detect(P3, P4, P5)
