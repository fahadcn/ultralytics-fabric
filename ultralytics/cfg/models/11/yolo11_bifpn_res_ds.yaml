# FG-YOLO Stage 2d: S1b (residual BiFPN skips) + SnakeBlock on backbone P3
# Motivation: Broken_yarn defects are extremely elongated thin lines (aspect up
# to ~85:1); stock square kernels confuse them with the weave -> dominant FP
# source (bg->Broken_yarn = 0.53). SnakeBlock = zero-init residual Dynamic Snake
# Convolution (DSConv, Qi et al. ICCV 2023; fabric evidence: DCFE-YOLO, Zhou et
# al. Sci. Rep. 2025). gamma=0 at init -> model starts EXACTLY as S1b, keeping
# full COCO transfer; the snake path is learned only where it helps.
# NOTE: layer 5 (SnakeBlock) shifts every stock layer >=5 by +1; Detect is 28.

# Parameters
nc: 80 # number of classes (overridden by data.yaml at train time)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11 backbone + SnakeBlock on P3 (the ONLY new backbone layer)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4: P3 features (stride 8)
  - [-1, 1, SnakeBlock, [512, 9]] # 5: zero-init residual snake enhancement of P3 (128ch @ n-scale)
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 2, C3k2, [1024, True]] # 9
  - [-1, 1, SPPF, [1024, 5]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

# YOLO11 head (stock topology, indices +1) + residual BiFPN skip refinement
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]] # cat backbone P4 (layer 7)
  - [-1, 2, C3k2, [512, False]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]] # cat snake-enhanced P3 (layer 5)
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 23 (P5/32-large)

  # --- residual BiFPN skip edges (S1b, unchanged) ---
  - [7, 1, Conv, [512, 1, 1]] # 24: P4 backbone skip lateral
  - [[20, 24], 1, BiFPNAdd, []] # 25: P4 refined
  - [11, 1, Conv, [1024, 1, 1]] # 26: P5 backbone skip lateral
  - [[23, 26], 1, BiFPNAdd, []] # 27: P5 refined

  - [[17, 25, 27], 1, Detect, [nc]] # 28: Detect(P3, P4_refined, P5_refined)
