# FG-YOLO Stage 1c: residual BiFPN skip-edge refinement at ALL THREE detection scales
# Extends Stage 1b (yolo11_bifpn_res.yaml, SUCCESS: mAP50-95 0.708, FPPI 0.160) with a
# third skip edge P3->P3. Layers 0-26 are identical to 1b, so stock pretrained weights
# transfer the same way; Detect moves 23 -> 29 (key remap handled in the train script).
# Hypothesis: P3 carries most small/high-frequency defect cues; a direct backbone path
# may help even though P3 is only 2 hops from the backbone (vs 6-7 for P4/P5).

# Parameters
nc: 80 # number of classes (overridden by data.yaml at train time)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11 backbone (UNCHANGED)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11 head (layers 11-22 UNCHANGED) + residual BiFPN skips at P3, P4, P5
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  # --- residual BiFPN skip edges (identical to Stage 1b) ---
  - [6, 1, Conv, [512, 1, 1]] # 23: P4 backbone skip lateral
  - [[19, 23], 1, BiFPNAdd, []] # 24: P4 refined
  - [10, 1, Conv, [1024, 1, 1]] # 25: P5 backbone skip lateral
  - [[22, 25], 1, BiFPNAdd, []] # 26: P5 refined

  # --- Stage 1c addition: P3 skip edge ---
  - [4, 1, Conv, [256, 1, 1]] # 27: P3 backbone skip lateral (128->64 @ n)
  - [[16, 27], 1, BiFPNAdd, []] # 28: P3 refined = w1*P3_out + w2*skip(P3 backbone)

  - [[28, 24, 26], 1, Detect, [nc]] # 29: Detect(P3_refined, P4_refined, P5_refined)
