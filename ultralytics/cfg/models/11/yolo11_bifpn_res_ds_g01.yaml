# FG-YOLO Stage 2e: S1b + SnakeBlock(g0=0.1) on backbone P3
# Identical to S2d (yolo11_bifpn_res_ds.yaml) except the residual gate gamma
# starts at 0.1 instead of 0. S2d showed the zero-init gate deadlocks under the
# 50ep transfer budget (gamma ended at -0.003 -> snake path never learned, model
# functionally = S1b). g0=0.1 perturbs the pretrained model only slightly while
# giving the snake branch real gradients from step 0. Gate vs S1b:
# mAP50-95 > 0.708 AND FPPI@0.25 < 0.160.
# NOTE: layer 5 (SnakeBlock) shifts every stock layer >=5 by +1; Detect is 28.

# Parameters
nc: 80 # number of classes (overridden by data.yaml at train time)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11 backbone + SnakeBlock on P3 (the ONLY new backbone layer)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4: P3 features (stride 8)
  - [-1, 1, SnakeBlock, [512, 9, 0.1]] # 5: residual snake enhancement of P3, gamma0=0.1 (128ch @ n-scale)
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 2, C3k2, [1024, True]] # 9
  - [-1, 1, SPPF, [1024, 5]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

# YOLO11 head (stock topology, indices +1) + residual BiFPN skip refinement
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]] # cat backbone P4 (layer 7)
  - [-1, 2, C3k2, [512, False]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]] # cat snake-enhanced P3 (layer 5)
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 23 (P5/32-large)

  # --- residual BiFPN skip edges (S1b, unchanged) ---
  - [7, 1, Conv, [512, 1, 1]] # 24: P4 backbone skip lateral
  - [[20, 24], 1, BiFPNAdd, []] # 25: P4 refined
  - [11, 1, Conv, [1024, 1, 1]] # 26: P5 backbone skip lateral
  - [[23, 26], 1, BiFPNAdd, []] # 27: P5 refined

  - [[17, 25, 27], 1, Detect, [nc]] # 28: Detect(P3, P4_refined, P5_refined)
