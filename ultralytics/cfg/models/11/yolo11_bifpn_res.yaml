# FG-YOLO Stage 1b: YOLO11n + residual BiFPN skip-edge refinement
# Stock yolo11.yaml backbone AND head kept 100% intact (full pretrained transfer);
# the two signature BiFPN skip edges (P4->P4, P5->P5) are ADDED as learnable
# weighted fusion on top of the stock PAN outputs. If the skips are useless the
# ReLU-gated weights can decay to ~0 -> degrades gracefully to stock YOLO11.

# Parameters
nc: 80 # number of classes (overridden by data.yaml at train time)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11 backbone (UNCHANGED)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11 head (layers 11-22 UNCHANGED from stock) + residual BiFPN skip refinement
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small) -> Detect small (direct, as stock)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  # --- residual BiFPN skip edges (the only new layers) ---
  - [6, 1, Conv, [512, 1, 1]] # 23: P4 backbone skip lateral (channel match)
  - [[19, 23], 1, BiFPNAdd, []] # 24: P4 refined = w1*P4_out + w2*skip(P4 backbone)
  - [10, 1, Conv, [1024, 1, 1]] # 25: P5 backbone skip lateral (channel match)
  - [[22, 25], 1, BiFPNAdd, []] # 26: P5 refined = w1*P5_out + w2*skip(P5 backbone)

  - [[16, 24, 26], 1, Detect, [nc]] # 27: Detect(P3, P4_refined, P5_refined)
