# FG-YOLO Stage 5: S1b + FcaGate (multi-spectral DCT channel gate) on skip laterals
# Motivation: the weave is periodic -> its feature energy concentrates in specific
# DCT components, but GAP-based attention collapses to the DC (weave-dominated) mean.
# FcaGate pools each skip-lateral channel onto K=16 DCT basis functions (FcaNet,
# CVPR 2021) and gates channels from that spectrum -> can down-weight weave-periodic
# channels before BiFPN fusion. Frequency op at FEATURE level (S2a lesson).
# Transfer-safe: skip laterals are random-init in S1b anyway; stock layers 0-22 keep
# their indices (full COCO transfer); Detect moves 27 -> 29.

# Parameters
nc: 80 # number of classes (overridden by data.yaml at train time)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11 backbone (UNCHANGED)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11 head (layers 11-22 UNCHANGED from stock) + frequency-gated BiFPN skips
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small) -> Detect small (direct, as stock)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  # --- frequency-gated residual BiFPN skip edges (S5: FcaGate added on laterals) ---
  - [6, 1, Conv, [512, 1, 1]] # 23: P4 backbone skip lateral (channel match)
  - [-1, 1, FcaGate, [16]] # 24: multi-spectral DCT gate on P4 skip (128ch @ n-scale)
  - [[19, 24], 1, BiFPNAdd, []] # 25: P4 refined = w1*P4_out + w2*FcaGate(skip P4)
  - [10, 1, Conv, [1024, 1, 1]] # 26: P5 backbone skip lateral (channel match)
  - [-1, 1, FcaGate, [16]] # 27: multi-spectral DCT gate on P5 skip (256ch @ n-scale)
  - [[22, 27], 1, BiFPNAdd, []] # 28: P5 refined = w1*P5_out + w2*FcaGate(skip P5)

  - [[16, 25, 28], 1, Detect, [nc]] # 29: Detect(P3, P4_refined, P5_refined)
