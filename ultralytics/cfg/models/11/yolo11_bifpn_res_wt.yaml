# FG-YOLO Stage 2a: S1b (residual BiFPN skips P4/P5) + wavelet stem
# Only change vs yolo11_bifpn_res.yaml: backbone layer 0 Conv(64,3,2) -> WTDown(64).
# Haar DWT preserves high-frequency sub-bands that strided conv destroys.
# Layer 0 is random-init (3->12 sub-band channels cannot transfer); layers 1-22 and
# the remapped Detect (23->27) still transfer from yolo11n.pt.
# Gate vs S1b: mAP50-95 > 0.708 AND FPPI@0.25 < 0.160.
# Falsifiable predictions: Broken_yarn recall up, bg->Broken_yarn FPs down.

# Parameters
nc: 80 # number of classes (overridden by data.yaml at train time)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11 backbone — layer 0 replaced with WTDown, rest UNCHANGED
backbone:
  # [from, repeats, module, args]
  - [-1, 1, WTDown, [64]] # 0-P1/2 (wavelet stem: DWT -> 12ch -> 1x1 conv)
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11 head (layers 11-22 UNCHANGED) + residual BiFPN skips P4/P5 (Stage 1b)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small) -> Detect small (direct, as stock)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  # --- residual BiFPN skip edges (Stage 1b, proven) ---
  - [6, 1, Conv, [512, 1, 1]] # 23: P4 backbone skip lateral
  - [[19, 23], 1, BiFPNAdd, []] # 24: P4 refined
  - [10, 1, Conv, [1024, 1, 1]] # 25: P5 backbone skip lateral
  - [[22, 25], 1, BiFPNAdd, []] # 26: P5 refined

  - [[16, 24, 26], 1, Detect, [nc]] # 27: Detect(P3, P4_refined, P5_refined)
